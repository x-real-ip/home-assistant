---
# Zendure SolarFlow 4000 Mix AC+ — settings and sensors
#
# Place at config/packages/zendure.yaml, with in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages

mqtt:
  select:
    # Operation mode. Node-RED's control loop reads this to decide whether
    # (and in which direction) it is allowed to charge/discharge.
    - name: "Zendure operation mode"
      unique_id: zendure_setting_operation_mode
      icon: mdi:battery-charging-wireless
      command_topic: "/homeassistant/zendure/setting/operation_mode/set"
      state_topic: "/homeassistant/zendure/setting/operation_mode/state"
      availability_topic: "/homeassistant/zendure/availability"
      qos: 1
      retain: true
      options:
        - "Standby"
        - "Zero export"
        - "Charge only"
        - "Discharge only"
        - "Force charge"
        - "Force discharge"
      device: &zendure_device
        identifiers: "zendure_solarflow"
        name: "Zendure SolarFlow 4000"
        manufacturer: "Zendure"
        model: "SolarFlow 4000 Mix AC+"

  number:
    # Ceiling on charge power. Also written to the battery's own hardware
    # limit (chargeMaxLimit), so it's enforced even if Node-RED goes down.
    - name: "Zendure max charge power"
      unique_id: zendure_setting_max_charge_power
      icon: mdi:format-vertical-align-top
      command_topic: "/homeassistant/zendure/setting/max_charge_power/set"
      state_topic: "/homeassistant/zendure/setting/max_charge_power/state"
      availability_topic: "/homeassistant/zendure/availability"
      qos: 1
      retain: true
      min: 100
      max: 4000
      step: 50
      mode: box
      unit_of_measurement: W
      device: *zendure_device

    # Ceiling on discharge power. Also written to the battery's own
    # hardware limit (inverseMaxPower).
    - name: "Zendure max discharge power"
      unique_id: zendure_setting_max_discharge_power
      icon: mdi:format-vertical-align-bottom
      command_topic: "/homeassistant/zendure/setting/max_discharge_power/set"
      state_topic: "/homeassistant/zendure/setting/max_discharge_power/state"
      availability_topic: "/homeassistant/zendure/availability"
      qos: 1
      retain: true
      min: 100
      max: 4000
      step: 50
      mode: box
      unit_of_measurement: W
      device: *zendure_device

    # Grid import threshold (W) above which discharging is allowed to start.
    - name: "Zendure start discharging at"
      unique_id: zendure_setting_start_discharging_at
      icon: mdi:battery-minus-variant
      command_topic: "/homeassistant/zendure/setting/start_discharging_at/set"
      state_topic: "/homeassistant/zendure/setting/start_discharging_at/state"
      availability_topic: "/homeassistant/zendure/availability"
      qos: 1
      retain: true
      min: 50
      max: 500
      step: 10
      mode: box
      unit_of_measurement: W
      device: *zendure_device

    # Grid export threshold (W, negative) below which charging is allowed
    # to start.
    - name: "Zendure start charging at"
      unique_id: zendure_setting_start_charging_at
      icon: mdi:battery-plus-variant
      command_topic: "/homeassistant/zendure/setting/start_charging_at/set"
      state_topic: "/homeassistant/zendure/setting/start_charging_at/state"
      availability_topic: "/homeassistant/zendure/availability"
      qos: 1
      retain: true
      min: -1000
      max: -50
      step: 10
      mode: box
      unit_of_measurement: W
      device: *zendure_device

    # Safety margin added on top of demand when discharging, so the house
    # keeps drawing a little from the grid instead of overshooting to export.
    - name: "Zendure charge buffer"
      unique_id: zendure_setting_charge_buffer
      icon: mdi:arrow-expand-vertical
      command_topic: "/homeassistant/zendure/setting/charge_buffer/set"
      state_topic: "/homeassistant/zendure/setting/charge_buffer/state"
      availability_topic: "/homeassistant/zendure/availability"
      qos: 1
      retain: true
      min: 0
      max: 250
      step: 5
      mode: box
      unit_of_measurement: W
      device: *zendure_device

    # Safety margin subtracted from demand when charging, so the battery
    # doesn't try to absorb the house's own last watts of import.
    - name: "Zendure discharge buffer"
      unique_id: zendure_setting_discharge_buffer
      icon: mdi:arrow-expand-vertical
      command_topic: "/homeassistant/zendure/setting/discharge_buffer/set"
      state_topic: "/homeassistant/zendure/setting/discharge_buffer/state"
      availability_topic: "/homeassistant/zendure/availability"
      qos: 1
      retain: true
      min: 0
      max: 250
      step: 5
      mode: box
      unit_of_measurement: W
      device: *zendure_device

    # Minutes of near-zero power before the battery is put into full
    # standby (storage mode -> Flash), to avoid idle drain (~19 W).
    - name: "Zendure standby delay"
      unique_id: zendure_setting_standby_delay
      icon: mdi:pause
      command_topic: "/homeassistant/zendure/setting/standby_delay/set"
      state_topic: "/homeassistant/zendure/setting/standby_delay/state"
      availability_topic: "/homeassistant/zendure/availability"
      qos: 1
      retain: true
      min: 5
      max: 60
      step: 1
      mode: box
      unit_of_measurement: min
      device: *zendure_device

    # Lower SOC bound. Below this, SOC protection force-charges the battery
    # regardless of operation mode (unless disabled below).
    - name: "Zendure minimum SOC"
      unique_id: zendure_setting_min_soc
      icon: mdi:percent-box
      command_topic: "/homeassistant/zendure/setting/min_soc/set"
      state_topic: "/homeassistant/zendure/setting/min_soc/state"
      availability_topic: "/homeassistant/zendure/availability"
      qos: 1
      retain: true
      min: 5
      max: 50
      step: 1
      mode: box
      unit_of_measurement: "%"
      device: *zendure_device

    # Upper SOC bound. Charging stops once this is reached. Also written to
    # the battery's own hardware limit (socSet).
    - name: "Zendure maximum SOC"
      unique_id: zendure_setting_max_soc
      icon: mdi:percent-box
      command_topic: "/homeassistant/zendure/setting/max_soc/set"
      state_topic: "/homeassistant/zendure/setting/max_soc/state"
      availability_topic: "/homeassistant/zendure/availability"
      qos: 1
      retain: true
      min: 70
      max: 100
      step: 1
      mode: box
      unit_of_measurement: "%"
      device: *zendure_device

  switch:
    # When on, disables the automatic force-charge that normally kicks in
    # below minimum SOC. Use with care — the battery can then run flat.
    - name: "Zendure SOC protection disabled"
      unique_id: zendure_setting_soc_protection_disabled
      icon: mdi:battery-heart-variant
      command_topic: "/homeassistant/zendure/setting/soc_protection_disabled/set"
      state_topic: "/homeassistant/zendure/setting/soc_protection_disabled/state"
      availability_topic: "/homeassistant/zendure/availability"
      qos: 1
      retain: true
      payload_on: "ON"
      payload_off: "OFF"
      device: *zendure_device

    # When on, blocks the battery from pushing its own PV production onto
    # the grid (writes gridReverse). Only relevant if panels are wired
    # directly into the Zendure rather than a separate inverter.
    - name: "Zendure PV export disabled"
      unique_id: zendure_setting_pv_export_disabled
      icon: mdi:solar-panel
      command_topic: "/homeassistant/zendure/setting/pv_export_disabled/set"
      state_topic: "/homeassistant/zendure/setting/pv_export_disabled/state"
      availability_topic: "/homeassistant/zendure/availability"
      qos: 1
      retain: true
      payload_on: "ON"
      payload_off: "OFF"
      device: *zendure_device

  sensor:
    # Raw P1 grid power reading (W), positive = import. Single latest
    # sample, before the median filter.
    - name: "Zendure grid power"
      unique_id: zendure_grid_power
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.grid_power }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      device: *zendure_device

    # Median of the last 5 grid power samples. What the control loop
    # actually steers on, to smooth out household load spikes.
    - name: "Zendure grid median"
      unique_id: zendure_grid_median
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.grid_median }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      device: *zendure_device

    # Battery power (W). Positive = charging, negative = discharging.
    - name: "Zendure battery power"
      unique_id: zendure_battery_power
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.battery_power }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      device: *zendure_device

    # Total battery state of charge (%).
    - name: "Zendure battery SOC"
      unique_id: zendure_battery_soc
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.battery_soc }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      device: *zendure_device

    # Raw acMode from the Zendure API (1 = charge relay, 2 = discharge
    # relay). Mostly a diagnostic mirror of what the control loop just set.
    - name: "Zendure AC mode"
      unique_id: zendure_ac_mode
      icon: mdi:swap-vertical-bold
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.ac_mode }}"
      availability_topic: "/homeassistant/zendure/availability"
      device: *zendure_device

    # BMS-reported limit state (normal / charge limit reached / discharge
    # limit reached). More reliable than comparing SOC percentages, which
    # get imprecise near the ends of the range.
    - name: "Zendure SOC limit status"
      unique_id: zendure_soc_limit_status
      icon: mdi:battery-medium
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.soc_limit_status }}"
      availability_topic: "/homeassistant/zendure/availability"
      device: *zendure_device

    # Battery pack serial number, as reported by the API.
    - name: "Zendure battery serial"
      unique_id: zendure_battery_sn
      icon: mdi:identifier
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.battery_sn }}"
      availability_topic: "/homeassistant/zendure/availability"
      entity_category: diagnostic
      device: *zendure_device

    # Minimum SOC as currently written to the battery's own hardware limit
    # (minSoc) — confirms the setting actually landed on the device.
    - name: "Zendure min SOC"
      unique_id: zendure_min_soc
      icon: mdi:battery-low
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.min_soc }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "%"
      device: *zendure_device

    # Maximum SOC as currently written to the battery's own hardware limit
    # (socSet) — confirms the setting actually landed on the device.
    - name: "Zendure max SOC"
      unique_id: zendure_max_soc
      icon: mdi:battery-high
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.max_soc }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "%"
      device: *zendure_device

    # Operation mode as last acted on by Node-RED. Diagnostic mirror of the
    # select entity above, useful to confirm the control loop actually
    # picked up a mode change.
    - name: "Zendure operation mode"
      unique_id: zendure_operation_mode
      icon: mdi:swap-horizontal
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.operation_mode }}"
      availability_topic: "/homeassistant/zendure/availability"
      device: *zendure_device

    # Max charge power as currently written to the battery's own hardware
    # limit (chargeMaxLimit).
    - name: "Zendure max charge power setting"
      unique_id: zendure_max_charge_power_setting
      icon: mdi:format-vertical-align-top
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.max_charge_power }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "W"
      device: *zendure_device

    # Max discharge power as currently written to the battery's own
    # hardware limit (inverseMaxPower).
    - name: "Zendure max discharge power setting"
      unique_id: zendure_max_discharge_power_setting
      icon: mdi:format-vertical-align-bottom
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.max_discharge_power }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "W"
      device: *zendure_device

    # Difference between the charge power Node-RED last requested and what
    # the battery is actually reporting — a nonzero value that persists
    # points at a stuck or lagging command.
    - name: "Zendure charge power diagnose"
      unique_id: zendure_charge_power_diagnose
      icon: mdi:compare-horizontal
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.setting_vs_actual_charge_power }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "W"
      entity_category: diagnostic
      device: *zendure_device

    # Same as above, for discharge power.
    - name: "Zendure discharge power diagnose"
      unique_id: zendure_discharge_power_diagnose
      icon: mdi:compare-horizontal
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.setting_vs_actual_discharge_power }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "W"
      entity_category: diagnostic
      device: *zendure_device

    # Count of charge/discharge relay switches today. High counts indicate
    # the control loop is oscillating and may need larger buffers or a
    # longer direction-change delay.
    - name: "Zendure relay switches today"
      unique_id: zendure_relay_switches_today
      icon: mdi:swap-vertical-bold
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.relay_switches_today }}"
      availability_topic: "/homeassistant/zendure/availability"
      state_class: total_increasing
      entity_category: diagnostic
      device: *zendure_device

    # Days since the battery last reached 100%. LiFePO4 needs a periodic
    # full charge to keep the BMS state-of-charge estimate accurate — if
    # this keeps climbing, charge to full once manually. Stays "unknown"
    # until the battery has been seen at 100% at least once, and never
    # resets on its own if max_soc is set below 100.
    #
    # Requires a new "days_since_full" (days, float) field in Node-RED's
    # publish payload on /homeassistant/zendure/info.
    - name: "Zendure days since full"
      unique_id: zendure_days_since_full
      icon: mdi:battery-clock
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.days_since_full }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "d"
      state_class: measurement
      entity_category: diagnostic
      device: *zendure_device

    # Battery pack voltage.
    #
    # Requires a new "battery_voltage" (V, float) field in Node-RED's
    # publish payload on /homeassistant/zendure/state.
    - name: "Zendure battery voltage"
      unique_id: zendure_battery_voltage
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.battery_voltage }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      icon: mdi:sine-wave
      device: *zendure_device

    # Battery pack current — not exposed by the Zendure zenSDK API (no
    # source field found), so this sensor was removed.
    # Error state as reported by the Zendure API ("No Notifications" /
    # "Check Zendure APP").
    #
    # Requires a new "error_status" (string) field in Node-RED's publish
    # payload on /homeassistant/zendure/state.
    - name: "Zendure error status"
      unique_id: zendure_error_status
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.error_status }}"
      availability_topic: "/homeassistant/zendure/availability"
      icon: mdi:battery-alert
      device: *zendure_device

    # Inverter temperature.
    #
    # Requires a new "inverter_temperature" (°C, float) field in
    # Node-RED's publish payload on /homeassistant/zendure/info.
    - name: "Zendure inverter temperature"
      unique_id: zendure_inverter_temperature
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.inverter_temperature }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: mdi:thermometer
      device: *zendure_device

    # Product model string, as reported by the API.
    #
    # Requires a new "product_model" (string) field in Node-RED's publish
    # payload on /homeassistant/zendure/info.
    - name: "Zendure product model"
      unique_id: zendure_product_model
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.product_model }}"
      availability_topic: "/homeassistant/zendure/availability"
      icon: mdi:identifier
      entity_category: diagnostic
      device: *zendure_device

    # Number of battery packs connected (packNum).
    #
    # Requires a new "total_batteries" (int) field in Node-RED's publish
    # payload on /homeassistant/zendure/info.
    - name: "Zendure total batteries"
      unique_id: zendure_total_batteries
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.total_batteries }}"
      availability_topic: "/homeassistant/zendure/availability"
      icon: mdi:flip-vertical
      entity_category: diagnostic
      device: *zendure_device

    # Battery pack current. Negative = discharging, positive = charging,
    # matching the sign convention of battery power.
    #
    # Requires a new "battery_current" (A, float) field in Node-RED's
    # publish payload on /homeassistant/zendure/state.
    - name: "Zendure battery current"
      unique_id: zendure_battery_current
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.battery_current }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      icon: mdi:current-dc
      device: *zendure_device

    # Actual household consumption (W), derived as grid power minus battery
    # power. This is what the control loop is really trying to cover, and
    # it stays meaningful regardless of which direction the battery runs.
    #
    # Requires a new "home_power" (W, float) field in Node-RED's publish
    # payload on /homeassistant/zendure/state.
    - name: "Zendure home power"
      unique_id: zendure_home_power
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.home_power }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:home-lightning-bolt
      device: *zendure_device

    # PV input power on the Zendure's own solar input. Currently always 0 —
    # no panels are wired to the battery yet — but in place for when they are.
    #
    # Requires a new "solar_power" (W, float) field in Node-RED's publish
    # payload on /homeassistant/zendure/state.
    - name: "Zendure solar power"
      unique_id: zendure_solar_power
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.solar_power }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:solar-power-variant
      device: *zendure_device

    # Battery cell temperature, as reported by the pack itself. Distinct
    # from the inverter temperature above — this one matters for battery
    # health and charge/discharge derating.
    #
    # Requires a new "battery_temperature" (°C, float) field in Node-RED's
    # publish payload on /homeassistant/zendure/info.
    - name: "Zendure battery temperature"
      unique_id: zendure_battery_temperature
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.battery_temperature }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: mdi:thermometer
      device: *zendure_device

    # Estimated minutes of discharge left at the current rate, as reported
    # by the device. Only meaningful while discharging; the device may
    # report a placeholder value when idle or charging.
    #
    # Requires a new "remaining_minutes" (min, int) field in Node-RED's
    # publish payload on /homeassistant/zendure/info.
    - name: "Zendure remaining discharge time"
      unique_id: zendure_remaining_minutes
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.remaining_minutes }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "min"
      device_class: duration
      state_class: measurement
      icon: mdi:timer-sand
      device: *zendure_device

    # Usable energy left in the battery (kWh), derived from SOC and the
    # pack's rated capacity. More tangible on a dashboard than a bare
    # percentage. Stays "unknown" if the pack type isn't in the capacity
    # lookup table in Node-RED.
    #
    # Requires a new "remaining_capacity_kwh" (kWh, float) field in
    # Node-RED's publish payload on /homeassistant/zendure/info.
    - name: "Zendure remaining capacity"
      unique_id: zendure_remaining_capacity
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.remaining_capacity_kwh }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "kWh"
      state_class: measurement
      icon: mdi:battery-charging-60
      device: *zendure_device

    # Total rated capacity of all connected packs (kWh).
    #
    # Requires a new "total_capacity_kwh" (kWh, float) field in Node-RED's
    # publish payload on /homeassistant/zendure/info.
    - name: "Zendure total capacity"
      unique_id: zendure_total_capacity
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.total_capacity_kwh }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "kWh"
      icon: mdi:flip-vertical
      entity_category: diagnostic
      device: *zendure_device

    # Wi-Fi signal strength of the Zendure hub. A weak signal shows up as
    # slow or failed API calls long before it shows up as a disconnect.
    #
    # Requires a new "wifi_signal" (dBm, int) field in Node-RED's publish
    # payload on /homeassistant/zendure/info.
    - name: "Zendure wifi signal"
      unique_id: zendure_wifi_signal
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.wifi_signal }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "dBm"
      device_class: signal_strength
      state_class: measurement
      entity_category: diagnostic
      device: *zendure_device

    # Fault level reported by the device. 0 is normal; other values may
    # carry more detail than the single error flag, though the exact
    # meaning of each level is not documented.
    #
    # Requires a new "fault_level" (int) field in Node-RED's publish
    # payload on /homeassistant/zendure/info.
    - name: "Zendure fault level"
      unique_id: zendure_fault_level
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.fault_level }}"
      availability_topic: "/homeassistant/zendure/availability"
      icon: mdi:alert-circle-outline
      entity_category: diagnostic
      device: *zendure_device

    # Serial number of the battery pack itself. The "battery serial" sensor
    # above reports the hub's serial, which is a different number.
    #
    # Requires a new "pack_sn" (string) field in Node-RED's publish payload
    # on /homeassistant/zendure/info.
    - name: "Zendure pack serial"
      unique_id: zendure_pack_sn
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.pack_sn }}"
      availability_topic: "/homeassistant/zendure/availability"
      icon: mdi:identifier
      entity_category: diagnostic
      device: *zendure_device

    # Charge power as an unsigned value (0 when not charging). Home
    # Assistant's energy dashboard wants each direction separately rather
    # than one signed figure.
    #
    # Requires a new "battery_charge_power" (W, float) field in Node-RED's
    # publish payload on /homeassistant/zendure/state.
    - name: "Zendure battery charge power"
      unique_id: zendure_battery_charge_power
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.battery_charge_power }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:battery-plus-variant
      device: *zendure_device

    # Discharge power as an unsigned value (0 when not discharging).
    #
    # Requires a new "battery_discharge_power" (W, float) field in
    # Node-RED's publish payload on /homeassistant/zendure/state.
    - name: "Zendure battery discharge power"
      unique_id: zendure_battery_discharge_power
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.battery_discharge_power }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:battery-minus-variant
      device: *zendure_device

    # Cumulative energy charged into the battery (kWh). Monotonically
    # increasing and never reset, so it can be used directly as a source
    # in Home Assistant's energy dashboard.
    #
    # Requires a new "charge_energy_kwh" (kWh, float) field in Node-RED's
    # publish payload on /homeassistant/zendure/state.
    - name: "Zendure charge energy"
      unique_id: zendure_charge_energy
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.charge_energy_kwh }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:battery-plus-variant
      device: *zendure_device

    # Cumulative energy discharged from the battery (kWh). Same properties
    # as the charge counter above.
    #
    # Requires a new "discharge_energy_kwh" (kWh, float) field in
    # Node-RED's publish payload on /homeassistant/zendure/state.
    - name: "Zendure discharge energy"
      unique_id: zendure_discharge_energy
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.discharge_energy_kwh }}"
      availability_topic: "/homeassistant/zendure/availability"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:battery-minus-variant
      device: *zendure_device

  binary_sensor:
    # On when the P1 grid reading is stale (no fresh sample within the
    # expected window). Node-RED's safety chain force-stops the battery
    # when this has been on too long.
    - name: "Zendure grid stale"
      unique_id: zendure_grid_stale
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.grid_stale }}"
      availability_topic: "/homeassistant/zendure/availability"
      payload_on: true
      payload_off: false
      device_class: problem
      device: *zendure_device

    # On when the battery is actively drawing from its PV input, rather
    # than purely charging/discharging from the AC side.
    - name: "Zendure PV active"
      unique_id: zendure_pv_active
      icon: mdi:solar-power
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.pv_active }}"
      availability_topic: "/homeassistant/zendure/availability"
      payload_on: true
      payload_off: false
      device: *zendure_device

    # On while the control loop's charge branch is active.
    - name: "Zendure charging active"
      unique_id: zendure_charging_active
      icon: mdi:battery-plus-variant
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.charging_active }}"
      availability_topic: "/homeassistant/zendure/availability"
      payload_on: true
      payload_off: false
      device: *zendure_device

    # On while the control loop's discharge branch is active.
    - name: "Zendure discharging active"
      unique_id: zendure_discharging_active
      icon: mdi:battery-minus-variant
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.discharging_active }}"
      availability_topic: "/homeassistant/zendure/availability"
      payload_on: true
      payload_off: false
      device: *zendure_device

    # Mirror of the SOC protection switch's effect, for at-a-glance status.
    - name: "Zendure SOC protection disabled"
      unique_id: zendure_soc_protection_disabled_status
      icon: mdi:battery-heart-variant
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.soc_protection_disabled }}"
      availability_topic: "/homeassistant/zendure/availability"
      payload_on: "ON"
      payload_off: "OFF"
      entity_category: diagnostic
      device: *zendure_device

    # Mirror of the PV export switch's effect, for at-a-glance status.
    - name: "Zendure PV export disabled"
      unique_id: zendure_pv_export_disabled_status
      icon: mdi:solar-panel
      state_topic: "/homeassistant/zendure/info"
      value_template: "{{ value_json.pv_export_disabled }}"
      availability_topic: "/homeassistant/zendure/availability"
      payload_on: "ON"
      payload_off: "OFF"
      entity_category: diagnostic
      device: *zendure_device

    # On while the battery is self-calibrating (socStatus). Node-RED's
    # standby logic waits for this to clear before allowing full standby.
    #
    # Requires a new "calibrating" (boolean) field in Node-RED's publish
    # payload on /homeassistant/zendure/state.
    - name: "Zendure calibrating"
      unique_id: zendure_calibrating
      state_topic: "/homeassistant/zendure/state"
      value_template: "{{ value_json.calibrating }}"
      availability_topic: "/homeassistant/zendure/availability"
      payload_on: true
      payload_off: false
      icon: mdi:battery-heart-variant
      device: *zendure_device
