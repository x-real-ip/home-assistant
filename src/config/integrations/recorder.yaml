---
recorder:
  db_url: !secret db_url
  purge_keep_days: 14
  commit_interval: 15
  exclude:
    domains:
      - automation
      - updater
      - light
      - script
      - switch
      - media_player
    entities:
      - sensor.solaredge_modbus_last_update
      - sensor.solaredge_modbus_ac_frequency
      - sensor.solaredge_modbus_ac_voltage_ab
      - sensor.zendure_solarflow_4000_zendure_grid_median
