    header:
      card:
        type: markdown
        text_only: true
        content: >
          {% set hour = now().hour %}

          {% if hour < 12 %}
            {% set greeting = "Goedemorgen" %}
          {% elif hour <= 16 %}
            {% set greeting = "Goedemiddag" %}
          {% else %}
            {% set greeting = "Goedenavond" %}
          {% endif %}


          {# --- Todo counts --- #}

          {% set housekeeping_items = states('todo.schoonmaak')|int %}

          {% set together_items     = states('todo.coen_anne')|int %}


          {# --- Helper macro for pluralization --- #}

          {% macro taak(count) -%}
            {{ "taak" if count == 1 else "taken" }}
          {%- endmacro %}


          {# --- Build task list --- #}

          {% set tasks = [] %}


          {% if housekeeping_items > 0 %}
            {% set tasks = tasks + [housekeeping_items ~ " huishoudelijke " ~
          taak(housekeeping_items)] %}
          {% endif %}


          {% if together_items > 0 %}
            {% set tasks = tasks + [together_items ~ " gezamenlijke " ~
          taak(together_items)] %}
          {% endif %}


          {% set total_tasks = housekeeping_items + together_items %}


          # {{ greeting }},


          {% set s_raw = states('sensor.picnic_expected_start_of_next_delivery')
          %}

          {% set e_raw = states('sensor.picnic_expected_end_of_next_delivery')
          %}

          {% if s_raw not in ['unknown', 'unavailable', 'none'] and
                e_raw not in ['unknown', 'unavailable', 'none'] %}
            {% set s = as_local(as_datetime(s_raw)) %}
            {% set e = as_local(as_datetime(e_raw)) %}
            {% if s.date() == now().date() %}
          🛒 **Picnic:** van {{ s.strftime('%H:%M') }} tot {{
          e.strftime('%H:%M') }}
            {% endif %}
          {% endif %}


          {% if tasks %} Er {% if total_tasks == 1 %}staat{% else %}staan{%
          endif %} {{ tasks[:-1]|join(', ') }}{% if tasks|length > 1 %} en {{
          tasks[-1] }}{% endif %} open • {% endif %} {{
          state_attr('sensor.custom_weather_description_01', 'header_01') }}
