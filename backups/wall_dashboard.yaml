  - type: custom:grid-layout
    icon: mdi:lightning-bolt
    path: energie
    layout:
      grid-template-columns: 65px 287px 550px 287px 65px
      grid-template-rows: auto auto
      grid-template-areas: >
        "left_header mid_header mid_header mid_header right_header"  "left_space
        gap1 mid_main gap2 right_space"
    cards:
      - type: custom:mushroom-chips-card
        chips:
          - type: back
        view_layout:
          grid-area: left_header
        card_mod:
          style: |
            ha-card {
              margin-top: 16px;
              margin-left: 16px;
            }
      - type: markdown
        text_only: true
        view_layout:
          grid-area: mid_header
        card_mod:
          style: |
            ha-card {
              margin-top: 16px;
              margin-left: auto;
              margin-right: auto;
              text-align: center;
            }
        content: >-
          {%- set ac_mode =
          states('sensor.zendure_solarflow_4000_zendure_ac_mode') -%} {%- set
          mode = states('sensor.zendure_solarflow_4000_zendure_operation_mode')
          -%} {%- set emergency =
          is_state('binary_sensor.zendure_solarflow_4000_zendure_emergency_active',
          'on') -%} {%- set soc =
          states('sensor.zendure_solarflow_4000_zendure_battery_soc') | float(0)
          -%} {%- set min_soc =
          states('sensor.zendure_solarflow_4000_zendure_min_soc') | float(0) -%}
          {%- set max_soc =
          states('sensor.zendure_solarflow_4000_zendure_max_soc') | float(100)
          -%} {%- set grid_median =
          states('sensor.zendure_solarflow_4000_zendure_grid_median') | float(0)
          -%} {%- set start_charging_at =
          states('number.zendure_solarflow_4000_zendure_start_charging_at') |
          float(-300) -%} {%- set start_discharging_at =
          states('number.zendure_solarflow_4000_zendure_start_discharging_at') |
          float(100) -%} {%- if emergency -%}
            {%- set bericht = 'Batterij staat in noodstop, de beveiliging heeft
          het systeem stilgezet.' -%}
          {%- elif mode == 'Standby' -%}
            {%- set bericht = 'Batterij staat in stand-by, er wordt niet geladen
          of ontladen.' -%}
          {%- elif ac_mode == '1' -%}
            {%- set power =
          states('sensor.zendure_solarflow_4000_zendure_battery_charge_power') |
          float(0) -%}
            {%- if power <= 0 -%}
              {%- if soc >= max_soc -%}
                {%- set bericht = 'Batterij zit op de maximale SOC van ' ~
          (max_soc | int) ~ '%, er wordt daarom niet geladen.' -%}
              {%- elif grid_median > start_charging_at -%}
                {%- set bericht = 'Batterij staat in laadstand, maar er is nu
          onvoldoende overschot om te laden.' -%}
              {%- else -%}
                {%- set bericht = 'Batterij staat in laadstand, maar er wordt op
          dit moment niet geladen.' -%}
              {%- endif -%}
            {%- else -%}
              {%- set total_kwh =
          states('sensor.zendure_solarflow_4000_zendure_total_capacity') |
          float(0) -%}
              {%- set nog_kwh = (max_soc - soc) / 100 * total_kwh -%}
              {%- if nog_kwh <= 0 -%}
                {%- set bericht = 'Batterij is bijna vol, het laden rondt zo
          af.' -%}
              {%- else -%}
                {%- set minutes = (nog_kwh / (power / 1000) * 60) | round(0) |
          int -%}
                {%- set duur = ((minutes // 60) ~ 'u ' ~ (minutes % 60) ~ 'm')
          if minutes >= 60 else (minutes ~ ' min') -%}
                {%- set bericht = 'Batterij is over **' ~ duur ~ '** vol' -%}
              {%- endif -%}
            {%- endif -%}
          {%- elif ac_mode == '2' -%}
            {%- set discharging =
            is_state('binary_sensor.zendure_solarflow_4000_zendure_discharging_active',
          'on') -%}
            {%- if not discharging -%}
              {%- if soc <= min_soc -%}
                {%- set bericht = 'Batterij zit op de minimale SOC van ' ~
          (min_soc | int) ~ '%, er wordt daarom niet ontladen.' -%}
              {%- elif grid_median < start_discharging_at -%}
                {%- set bericht = 'Batterij staat in ontlaadstand, maar er is nu
          onvoldoende vraag om te ontladen.' -%}
              {%- else -%}
                {%- set bericht = 'Batterij staat in ontlaadstand, maar ontlaadt
          op dit moment niet.' -%}
              {%- endif -%}
            {%- else -%}
              {%- set minutes_raw =
              states('sensor.zendure_solarflow_4000_zendure_remaining_discharge_time')
          -%}
              {%- if minutes_raw in ['unknown', 'unavailable', 'none'] -%}
                {%- set bericht = 'Batterij ontlaadtijd is nog niet bekend.' -%}
              {%- else -%}
                {%- set minutes = minutes_raw | int(0) -%}
                {%- set duur = ((minutes // 60) ~ 'u ' ~ (minutes % 60) ~ 'm')
          if minutes >= 60 else (minutes ~ ' min') -%}
                {%- set bericht = 'Batterij kan nog **' ~ duur ~ '** ontladen'
          -%}
              {%- endif -%}
            {%- endif -%}
          {%- else -%}
            {%- set bericht = 'Batterij status is op dit moment onbekend.' -%}
          {%- endif -%} # Energie

          {{ bericht }}
      - type: custom:gap-card
        view_layout:
          grid-area: right_header
      - type: vertical-stack
        cards:
          - type: heading
            icon: mdi:home-thermometer-outline
            heading_style: title
            heading: Klimaat
            badges:
              - type: entity
                show_state: true
                show_icon: true
                name: Verwarming
                icon: mdi:heat-wave
                color: deep-orange
                visibility:
                  - condition: state
                    entity: sensor.basement_heating
                    state_not: "0.0"
                entity: sensor.basement_heating
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.basement_temperature
                name: Temperatuur
                color: deep-orange
                vertical: false
                features:
                  - type: trend-graph
                    detail: true
                    hours_to_show: 8
                features_position: bottom
              - type: tile
                entity: sensor.basement_humidity
                name: Luchtvochtigheid
                color: cyan
                vertical: false
                features:
                  - type: trend-graph
                    detail: true
                    hours_to_show: 8
                features_position: bottom
          - type: custom:mushroom-climate-card
            grid_options:
              columns: 12
              rows: 1
            show_temperature_control: true
            secondary_info: none
            icon_type: icon
            primary_info: name
            collapsible_controls: true
            hvac_modes:
              - "off"
              - heat
            name: Thermostaat
            layout: horizontal
            tap_action:
              action: more-info
            entity: climate.basement
          - type: custom:gap-card
          - type: heading
            heading: Sensoren
            heading_style: title
            icon: mdi:eye-outline
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: binary_sensor.washing_machine
                layout: vertical
                fill_container: false
                secondary_info: last-changed
                icon_color: cyan
                name: Wasmachine
                tap_action:
                  action: more-info
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                primary_info: name
                grid_options:
                  columns: 6
                  rows: 2
              - type: custom:mushroom-entity-card
                entity: binary_sensor.tumble_dryer
                icon: ""
                layout: vertical
                fill_container: false
                secondary_info: last-changed
                icon_color: cyan
                tap_action:
                  action: more-info
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                name: Wasdroger
                primary_info: name
                grid_options:
                  columns: 6
                  rows: 2
          - type: custom:mushroom-template-card
            primary: Luchtontvochtiger
            icon: mdi:air-humidifier
            features_position: bottom
            entity: sensor.shellyplugplus_dehumidifier_switch_0_power
            secondary: >-
              {% if states('sensor.shellyplugplus_dehumidifier_switch_0_power')
              | float(0) > 50 %}
                Actief
              {% else %}
                Inactief
              {% endif %}
            color: >-
              {% if states('sensor.shellyplugplus_dehumidifier_switch_0_power')
              | float(0) > 50 %}

              cyan

              {% else %}

              disabled

              {% endif %}
            vertical: true
            icon_tap_action:
              action: more-info
        view_layout:
          grid-area: 2/2/3/3
