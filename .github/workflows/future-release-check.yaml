---
name: Future Release Check

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-check:
    name: "Home Assistant ${{ matrix.version }} Configuration Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        version: ["beta", "dev"]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ matrix.version }}
      ASSIGNEES: x-real-ip
      LABEL: upstream-break
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # This check must never gate a deploy, so the failure is captured here
      # and reported as an issue instead of failing the job.
      - name: Run Home Assistant Configuration Check
        id: check
        continue-on-error: true
        uses: frenck/action-home-assistant@v1
        with:
          path: "./src/config"
          secrets: secrets.yaml.example
          version: "${{ matrix.version }}"

      # The image is already pulled by the step above, so this is free.
      - name: Resolve core version behind the channel
        id: core
        run: |
          core=$(docker run --rm --entrypoint "" \
            "ghcr.io/home-assistant/home-assistant:${CHANNEL}" \
            python -m homeassistant --version)
          echo "core=$core" >> "$GITHUB_OUTPUT"

      - name: Report result
        env:
          CORE: ${{ steps.core.outputs.core }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          title="Configuration check fails on Home Assistant ${CHANNEL}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          run_url="${run_url}/actions/runs/${GITHUB_RUN_ID}"

          existing=$(gh issue list \
            --state open \
            --search "\"$title\" in:title" \
            --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")

          if [ "$OUTCOME" = "failure" ]; then
            echo "### ❌ Fails on \`${CHANNEL}\` (${CORE})" >> "$GITHUB_STEP_SUMMARY"

            body="The configuration check fails against the \`${CHANNEL}\`
          channel, currently **${CORE}**.

          This does not block deployment: the deployed version still passes.
          It is an early warning that a future core release breaks this
          configuration.

          [View the failing run](${run_url})"

            if [ -n "$existing" ]; then
              echo "Issue #$existing is already open, not opening another."
              exit 0
            fi

            gh label create "$LABEL" \
              --color B60205 \
              --description "Config breaks on an upcoming Home Assistant release" \
              2>/dev/null || true

            gh issue create \
              --title "$title" \
              --body "$body" \
              --label "$LABEL" \
              --assignee "$ASSIGNEES"
            exit 0
          fi

          echo "### ✅ Passes on \`${CHANNEL}\` (${CORE})" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment \
              "Resolved: the check passes again on \`${CHANNEL}\`
          (${CORE}). [Run](${run_url})"
          fi
