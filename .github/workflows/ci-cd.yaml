---
name: CI/CD

on:
  push:
    branches:
      - main
    # Only ./src/config and the Containerfile end up in the image, so a change
    # to docs or backups cannot alter what is deployed. Deliberately a
    # deny-list: a forgotten path here still builds, where a forgotten path in
    # an allow-list would silently skip a deploy.
    paths-ignore:
      - "README.md"
      - "assets/**"
      - "backups/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A build that is already pushing an image or dispatching to gitops must
  # finish; cancelling it halfway leaves gitops pointing at a stale sha.
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-checks.yaml

  build-and-push-image:
    name: Build and Push Image
    permissions:
      contents: read
      packages: write
    uses: x-real-ip/github-actions/.github/workflows/build-and-push.yaml@v2
    with:
      push: true

  dispatch-update-manifest:
    name: Repository Dispatch to Update Manifest
    needs: [checks, build-and-push-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT }}
          repository: x-real-ip/gitops
          event-type: update-manifest
          client-payload: >-
            {"ref": "${{ github.ref }}",
            "repository": "${{ github.repository }}",
            "registry": "ghcr.io",
            "sha": "${{ github.sha }}"}
