---
name: Check releases

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled run can leave an issue created but its bump PR missing.
  cancel-in-progress: false

jobs:
  check-releases:
    name: "Check ${{ matrix.name }}"
    permissions:
      contents: write
      issues: write
      packages: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home-assistant
            type: release
            target: home-assistant/core
            bump: true
            bump_type: containerfile
            image: "ghcr.io/home-assistant/home-assistant"
    uses: x-real-ip/github-actions/.github/workflows/new-release-issue.yaml@main
    with:
      name: ${{ matrix.name }}
      target: ${{ matrix.target }}
      type: ${{ matrix.type }}
      bump: ${{ matrix.bump }}
      bump_type: ${{ matrix.bump_type }}
      image: ${{ matrix.image }}
    secrets:
      PAT: ${{ secrets.PAT }}
